name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Qureo APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android Licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Setup Gradle 8.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Configure Repositories & Settings
        run: |
          cat << 'EOF' > android_app/settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  maven { url 'https://repo1.maven.org/maven2/' }
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
              repositories {
                  google()
                  mavenCentral()
                  maven { url 'https://repo1.maven.org/maven2/' }
              }
          }
          rootProject.name = "QureoAutoSolver"
          include ':app'
          EOF

      - name: Build APK
        working-directory: android_app
        run: |
          gradle assembleDebug --refresh-dependencies --stacktrace
          mkdir -p output_apk
          cp app/build/outputs/apk/debug/*.apk output_apk/QureoAutoSolver_Turbo.apk

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: QureoAutoSolver_Turbo_APK
          path: android_app/output_apk/QureoAutoSolver_Turbo.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish Release with APK
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v2.0-mobile
          name: "Qureo Auto Solver 2026 - Turbo Mobile APK"
          body: |
            ### ⚡ QUREO AUTO SOLVER 2026 - TURBO MOBILE APK
            - حل جميع الفصول الـ 42 بنسبة 100% (5 ماسات كاملة لكل فصل).
            - يدعم المنهج العربي والإنجليزي تلقائياً.
          files: android_app/output_apk/QureoAutoSolver_Turbo.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
