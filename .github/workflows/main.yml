name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Qureo APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Accept Android Licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build APK
        working-directory: android_app
        run: |
          gradle assembleDebug --stacktrace
          mkdir -p output_apk
          cp app/build/outputs/apk/debug/*.apk output_apk/QureoAutoSolver_Turbo.apk

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: QureoAutoSolver_Turbo_APK
          path: android_app/output_apk/QureoAutoSolver_Turbo.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v2.0-mobile
          name: "Qureo Auto Solver 2026 - Turbo Mobile APK"
          body: |
            ### ⚡ QUREO AUTO SOLVER 2026 - TURBO MOBILE APK
            - حل جميع الفصول الـ 42 بنسبة 100% (5 ماسات كاملة لكل فصل).
            - يدعم المنهج العربي والمنهج الإنجليزي تلقائياً.
            
            **طريقة التثبيت:** اضغط على `QureoAutoSolver_Turbo.apk` بالأسفل وحمله على موبايلك وثبته فوراً!
          files: android_app/output_apk/QureoAutoSolver_Turbo.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
